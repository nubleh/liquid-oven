<style id="_shellStyle">
:root{--bg:#f0e8d8;--cd:rgba(255,252,245,.88);--i:#1a1008;--d:#5a4a38;--br:rgba(26,16,8,.18);--sh:rgba(26,16,8,.10);--go:#8a6520;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--i);font-family:Georgia,'Times New Roman',serif;font-size:16px;line-height:1.5;}
#_g{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:32px 24px;}

<script>
(function(){
  var SALT_B64='g6WtDOqEIupEVlFbLZFy3w==';
  var IT=100000;
  var SK='_p';
  var gm=document.getElementById('_gm');

  function b2b(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0);});}

  function dk(p,s){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          {name:'PBKDF2',salt:s,iterations:IT,hash:'SHA-256'},
          km,{name:'AES-GCM',length:256},false,['decrypt']
        );
      });
  }

  // Decrypts one fetched module's raw ArrayBuffer. Same iv(12)||data||tag
  // binary layout already used for sprite sheets (no per-file salt — every
  // module and every sprite sheet shares the ONE session key derived from
  // SALT_B64 above), so this is the exact same shape as sprite-worker.js's
  // own attemptSheetLoad() decrypt step, just fetching a differently-named
  // file.
  function decModule(buf,k){
    var bytes=new Uint8Array(buf),iv=bytes.slice(0,12),data=bytes.slice(12);
    return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,data)
      .then(function(r){return new TextDecoder().decode(r);});
  }

  // crypto.subtle.decrypt() has been observed to transiently throw
  // OperationError even on correct input under load (see sprite-worker.js's
  // own getSheetImage() retry) — cheap insurance to retry a few times
  // before concluding the passphrase itself is actually wrong.
  function decModuleWithRetry(buf,k,attemptsLeft){
    if(attemptsLeft===undefined)attemptsLeft=3;
    return decModule(buf,k).catch(function(err){
      if(attemptsLeft>1)return decModuleWithRetry(buf,k,attemptsLeft-1);
      throw err;
    });
  }

  function launch(html){
    // The lock screen's own <style id="_shellStyle"> (html,body{height:100%}
    // among other rules, needed to center the passphrase prompt) otherwise
    // lingers in <head> forever — appendChild below only ever ADDS the real
    // app's styles alongside it, never removes it. That leftover
    // html,body{height:100%} caps <body>'s own box at exactly viewport
    // height while the real catalog content overflows far past it, so any
    // position:sticky element whose containing block is <body> itself
    // (the toolbar) runs out of room to stick in and scrolls away once
    // you pass one viewport-height of scroll — while a sticky element
    // whose containing block is something taller (the filters sidebar,
    // contained in #layout, which grows with the actual grid) stays stuck
    // correctly the whole way. Removing the shell style before launching
    // fixes this for good.
    var shellStyle=document.getElementById('_shellStyle');
    if(shellStyle)shellStyle.parentNode.removeChild(shellStyle);
    var inner=new DOMParser().parseFromString(html,'text/html');
    document.title=inner.title;
    inner.querySelectorAll('style').forEach(function(s){
      document.head.appendChild(document.importNode(s,true));
    });
    // Query the whole parsed document, not just inner.body — a fragment
    // that's ONLY <script> tags (the data module) has no other body-
    // inducing content, so the HTML tree-construction algorithm places
    // those scripts under <head> instead of <body>. inner.body would find
    // zero scripts for that module and silently skip injecting it.
    var scripts=[];
    inner.querySelectorAll('script').forEach(function(s){
      scripts.push(s.textContent);
      s.parentNode.removeChild(s);
    });
    document.body.className=inner.body.className;
    document.body.innerHTML=inner.body.innerHTML;
    scripts.forEach(function(code){
      var s=document.createElement('script');
      s.textContent=code;
      document.body.appendChild(s);
    });
  }

  // ── Update checklist ─────────────────────────────────────────────────
  // Replaces the old "decrypt both modules and launch immediately"
  // tryUnlock() with a state machine: derive the key, fetch the manifest,
  // show every content module (shell, misc, store-history, the catalog
  // fragments as one aggregate tile, each sprite sheet) with its
  // unchanged/stale status, auto-download whatever's stale with visible
  // progress, and only then reveal a manual "Enter catalog" button — never
  // auto-proceed, even when nothing needed downloading. No page reload:
  // the existing launch() already injects content into the live page, so
  // it just moves behind the button click instead of firing automatically.
  var MODULES_CACHE_NAME='catalog-modules';
  var DOWNLOAD_CONCURRENCY=3;
  var ICONS={"apps":"<svg viewBox=\"0 -960 960 960\" fill=\"currentColor\"><path d=\"M240-160q-33 0-56.5-23.5T160-240q0-33 23.5-56.5T240-320q33 0 56.5 23.5T320-240q0 33-23.5 56.5T240-160Zm240 0q-33 0-56.5-23.5T400-240q0-33 23.5-56.5T480-320q33 0 56.5 23.5T560-240q0 33-23.5 56.5T480-160Zm240 0q-33 0-56.5-23.5T640-240q0-33 23.5-56.5T720-320q33 0 56.5 23.5T800-240q0 33-23.5 56.5T720-160ZM240-400q-33 0-56.5-23.5T160-480q0-33 23.5-56.5T240-560q33 0 56.5 23.5T320-480q0 33-23.5 56.5T240-400Zm240 0q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm240 0q-33 0-56.5-23.5T640-480q0-33 23.5-56.5T720-560q33 0 56.5 23.5T800-480q0 33-23.5 56.5T720-400ZM240-640q-33 0-56.5-23.5T160-720q0-33 23.5-56.5T240-800q33 0 56.5 23.5T320-720q0 33-23.5 56.5T240-640Zm240 0q-33 0-56.5-23.5T400-720q0-33 23.5-56.5T480-800q33 0 56.5 23.5T560-720q0 33-23.5 56.5T480-640Zm240 0q-33 0-56.5-23.5T640-720q0-33 23.5-56.5T720-800q33 0 56.5 23.5T800-720q0 33-23.5 56.5T720-640Z\"/></svg>","database":"<svg viewBox=\"0 -960 960 960\" fill=\"currentColor\"><path d=\"M480-120q-151 0-255.5-46.5T120-280v-400q0-66 105.5-113T480-840q149 0 254.5 47T840-680v400q0 67-104.5 113.5T480-120Zm0-479q89 0 179-25.5T760-679q-11-29-100.5-55T480-760q-91 0-178.5 25.5T200-679q14 30 101.5 55T480-599Zm0 199q42 0 81-4t74.5-11.5q35.5-7.5 67-18.5t57.5-25v-120q-26 14-57.5 25t-67 18.5Q600-528 561-524t-81 4q-42 0-82-4t-75.5-11.5Q287-543 256-554t-56-25v120q25 14 56 25t66.5 18.5Q358-408 398-404t82 4Zm0 200q46 0 93.5-7t87.5-18.5q40-11.5 67-26t32-29.5v-98q-26 14-57.5 25t-67 18.5Q600-328 561-324t-81 4q-42 0-82-4t-75.5-11.5Q287-343 256-354t-56-25v99q5 15 31.5 29t66.5 25.5q40 11.5 88 18.5t94 7Z\"/></svg>","image":"<svg viewBox=\"0 -960 960 960\" fill=\"currentColor\"><path d=\"M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm40-80h480L570-480 450-320l-90-120-120 160Zm-40 80v-560 560Z\"/></svg>","sync":"<svg viewBox=\"0 -960 960 960\" fill=\"currentColor\"><path d=\"M160-160v-80h110l-16-14q-52-46-73-105t-21-119q0-111 66.5-197.5T400-790v84q-72 26-116 88.5T240-478q0 45 17 87.5t53 78.5l10 10v-98h80v240H160Zm400-10v-84q72-26 116-88.5T720-482q0-45-17-87.5T650-648l-10-10v98h-80v-240h240v80H690l16 14q49 49 71.5 106.5T800-482q0 111-66.5 197.5T560-170Z\"/></svg>","downloading":"<svg viewBox=\"0 -960 960 960\" fill=\"currentColor\"><path d=\"M439-82q-76-8-141.5-42.5t-113.5-88Q136-266 108.5-335T81-481q0-155 102.5-268.5T440-880v80q-121 17-200 107.5T161-481q0 121 79 211.5T439-162v80Zm40-198L278-482l57-57 104 104v-245h80v245l103-103 57 58-200 200Zm40 198v-80q43-6 82.5-23t73.5-43l58 58q-47 37-101 59.5T519-82Zm158-652q-35-26-74.5-43T520-800v-80q59 6 113 28.5T733-792l-56 58Zm112 506-56-57q26-34 42-73.5t22-82.5h82q-8 59-30 113.5T789-228Zm8-293q-6-43-22-82.5T733-677l56-57q38 45 61 99.5T879-521h-82Z\"/></svg>","check_circle":"<svg viewBox=\"0 -960 960 960\" fill=\"currentColor\"><path d=\"m424-296 282-282-56-56-226 226-114-114-56 56 170 170Zm56 216q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z\"/></svg>","error":"<svg viewBox=\"0 -960 960 960\" fill=\"currentColor\"><path d=\"M480-280q17 0 28.5-11.5T520-320q0-17-11.5-28.5T480-360q-17 0-28.5 11.5T440-320q0 17 11.5 28.5T480-280Zm-40-160h80v-240h-80v240Zm40 360q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z\"/></svg>"};
  // Single-flight guard for attemptUnlock() — see its own comment below for
  // the race this closes (a manual passphrase resubmit during an in-flight
  // auto-resume used to corrupt shared state; confirmed unguarded before
  // this existed).
  var UNLOCK_IN_FLIGHT=false;
  // Resolves once every sprite sheet has been attempted (success or
  // failure) — read by report.html's wireThumbFallback() to know when it's
  // safe to conclude a thumbnail is genuinely missing rather than just
  // not-yet-downloaded (see that function's own comment). Set up ONCE here
  // (not per-load-attempt) so both the progressive path
  // (beginBackgroundLoad) and the fast path (beginSpritePriming) resolve
  // the SAME promise regardless of which one actually launched the app.
  var spritesSettledResolve;
  window.__spritesSettled=new Promise(function(res){spritesSettledResolve=res;});

  function fmtBytes(n){
    if(n>1024*1024)return (n/1024/1024).toFixed(1)+'MB';
    if(n>1024)return Math.round(n/1024)+'KB';
    return n+'B';
  }

  // launch(html) (above) REPLACES document.body.innerHTML wholesale — the
  // right thing for shell (real UI markup) launching once, but every data
  // module (misc/store-history/every catalog/products-historical/
  // box-contents fragment) is script-only content with no body markup of
  // its own, so calling launch() on one AFTER shell has already rendered
  // would wipe the live app back to empty (inner.body.innerHTML is empty
  // for a script-only fragment — caught for real: renderRangeFilters()
  // throwing on a null #price-range-filter container a moment after shell
  // first rendered, because a fragment's launch() call had already erased
  // it). This just executes a script-only module's <script> tags via fresh
  // elements (so they actually run, same as launch() does), WITHOUT
  // touching body.innerHTML at all — safe to call any number of times
  // after shell is already showing. Only ever used for data
  // modules/fragments in the progressive path (beginBackgroundLoad,
  // below); the fast path still uses launch() for everything (shell
  // launches LAST there, so intermediate launch() calls' body-wiping never
  // matters — same as the old design).
  function runScriptOnly(html){
    var inner=new DOMParser().parseFromString(html,'text/html');
    var scripts=[];
    inner.querySelectorAll('script').forEach(function(s){scripts.push(s.textContent);});
    scripts.forEach(function(code){
      var s=document.createElement('script');
      s.textContent=code;
      document.body.appendChild(s);
    });
  }

  function cacheHas(url){
    return caches.open(MODULES_CACHE_NAME).then(function(c){return c.match(url);}).then(function(m){return !!m;});
  }

  // Concurrency-limited pool: runs worker(item) for every item, at most
  // `limit` in flight at once. worker() must never reject — each item
  // handles its own success/failure internally (see attemptSprite()) so
  // one item's failure can't abort the others still in flight.
  function runPool(items,limit,worker){
    return new Promise(function(resolve){
      var idx=0,active=0,total=items.length;
      if(total===0){resolve();return;}
      function next(){
        if(idx>=total){if(active===0)resolve();return;}
        var item=items[idx++];active++;
        worker(item).then(function(){active--;next();});
      }
      for(var i=0;i<Math.min(limit,total);i++)next();
    });
  }

  // Streams one module's bytes with progress reporting, retrying the
  // whole stream a few times on failure — same empirically-necessary
  // retry convention as decModuleWithRetry above and sprite-worker.js's
  // getSheetImage(), since a transient network hiccup mid-stream
  // shouldn't be treated as permanent.
  function downloadWithRetry(url,expectedSize,onProgress,attemptsLeft){
    if(attemptsLeft===undefined)attemptsLeft=3;
    return fetch(url).then(function(resp){
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      var total=parseInt(resp.headers.get('content-length')||'0',10)||expectedSize;
      var reader=resp.body.getReader();
      var chunks=[],loaded=0;
      function pump(){
        return reader.read().then(function(res){
          if(res.done){
            var buf=new Uint8Array(loaded),off=0;
            chunks.forEach(function(c){buf.set(c,off);off+=c.length;});
            return buf.buffer;
          }
          chunks.push(res.value);
          loaded+=res.value.length;
          onProgress(loaded,total);
          return pump();
        });
      }
      return pump();
    }).catch(function(err){
      if(attemptsLeft>1)return downloadWithRetry(url,expectedSize,onProgress,attemptsLeft-1);
      throw err;
    });
  }

  // ── Progressive background loading ──────────────────────────────────
  // Replaces the old full-screen blocking checklist entirely for the
  // "something isn't cached" case (the fast path below, for "everything's
  // already cached," is untouched in spirit). Shell launches the MOMENT
  // its own bytes decrypt — with empty data stubs in place — then every
  // data module/fragment and every sprite sheet streams in afterward,
  // fully in the background, each one calling notifyDataUpdated() the
  // instant it lands so report.html's grid updates live. No row here has
  // its own DOM (no per-tile UI anymore) — progress is reported through
  // one small floating panel (initMiniPanel()/updateMiniPanelProgress()/
  // finishMiniPanel(), further below) built from aggregate byte/count
  // totals across every row.

  // Must exist before shell's own script (report.html's IIFE) runs, or its
  // unconditional `CATALOG.products`/`PRODUCTS_HISTORICAL.products`
  // dereference throws and aborts the whole page. Plain window.X
  // assignments (not var/const) so a LATER module's `var X = {...}`
  // redeclaration never conflicts — a var redeclaration over an existing
  // global always succeeds, whereas a const/let one would throw
  // SyntaxError if it collided with an existing lexical binding. This is
  // why every fragment-0/module builder that (re)declares one of these
  // four names emits `var`, not `const` (see buildStoreHistoryModule()'s
  // own const->var patch on the Node side for the one case that needed it).
  function ensureDataStubs(){
    window.CATALOG=window.CATALOG||{fetchedAt:null,count:0,activeCount:0,products:[]};
    window.PRODUCTS_HISTORICAL=window.PRODUCTS_HISTORICAL||{fetchedAt:null,count:0,products:[]};
    window.BOX_CONTENTS=window.BOX_CONTENTS||{};
    window.STORE_HISTORY=window.STORE_HISTORY||{runs:[]};
  }

  function notifyDataUpdated(){
    if(window.__catalogDataUpdated)window.__catalogDataUpdated();
    updateMiniPanelProgress();
  }

  function buildShellRow(manifest){
    return {file:manifest.shell.file,size:manifest.shell.size,loaded:0};
  }
  function buildFragmentedGroupRow(key,globalName,fragmentsManifest){
    return {
      key:key,globalName:globalName,type:'group',
      fragments:fragmentsManifest.map(function(f,i){return {index:i,file:f.file,size:f.size,state:'pending',cached:false,html:null,loaded:0};}),
      declared:false,pendingLaunch:[],cachedCount:0,staleCount:0,
    };
  }
  function buildDataRows(manifest){
    return [
      {key:'misc',file:manifest.misc.file,size:manifest.misc.size,type:'file',loaded:0},
      {key:'storeHistory',file:manifest.storeHistory.file,size:manifest.storeHistory.size,type:'file',loaded:0},
      buildFragmentedGroupRow('catalog','CATALOG',manifest.catalogFragments),
      buildFragmentedGroupRow('productsHistorical','PRODUCTS_HISTORICAL',manifest.productsHistoricalFragments),
      buildFragmentedGroupRow('boxContents','BOX_CONTENTS',manifest.boxContentsFragments),
    ];
  }
  function buildSpriteRows(manifest){
    return manifest.sprites.map(function(s,i){return {key:'sprite'+i,file:s.file,size:s.size,state:'pending',loaded:0};});
  }

  // needsBuffer: shell/misc/store-history need their decrypted bytes back;
  // sprite rows only need to end up cached, so an already-cached sprite
  // skips reading its (several-MB) bytes back out of Cache Storage for
  // nothing. No DOM coupling — every row/fragment here is a plain object,
  // progress is read by updateMiniPanelProgress() off row.loaded/row.size/
  // row.state whenever it wants a fresh snapshot, not pushed per-tick.
  function resolveRow(row,needsBuffer){
    return cacheHas(row.file).then(function(has){
      if(has){
        row.state='unchanged';
        row.loaded=row.size;
        if(!needsBuffer)return null;
        return caches.open(MODULES_CACHE_NAME).then(function(c){return c.match(row.file);}).then(function(r){return r.arrayBuffer();});
      }
      return downloadRow(row);
    });
  }
  function downloadRow(row){
    row.loaded=0;
    row.state='downloading';
    return downloadWithRetry(row.file,row.size,function(loaded){
      row.loaded=loaded;
      updateMiniPanelProgress();
    }).then(function(buf){
      return caches.open(MODULES_CACHE_NAME).then(function(c){return c.put(row.file,new Response(buf));}).then(function(){
        row.loaded=row.size;
        row.state='done';
        return buf;
      });
    });
  }

  // Every module/fragment shares ONE derived session key — once shell
  // itself decrypts successfully (the one real gate, see
  // hardFailWrongPassphrase below), the passphrase is proven correct, so
  // any OTHER module/fragment/sprite later failing to decrypt can only
  // mean data corruption, not a bad passphrase. Treated the same as a
  // download failure: non-fatal, logged, never blocks or reverts the rest
  // of the app — a real, deliberate simplification versus the old
  // full-checklist design, where any critical-row decrypt failure hard-
  // failed the whole flow.
  function attemptDataRow(row){
    return resolveRow(row,true).then(function(buf){
      return decModuleWithRetry(buf,window.__spriteKey);
    }).then(function(html){
      row.html=html;
      row.state='done';
      runScriptOnly(html);
      notifyDataUpdated();
    }).catch(function(err){
      row.state='error';
      updateMiniPanelProgress();
      console.log('data module failed to load (non-fatal, app keeps working without it):',row.file,err);
    });
  }

  // Catalog/products-historical/box-contents fragments all launch
  // INDIVIDUALLY the instant their own decrypt finishes, instead of
  // waiting for the whole group like the old checklist did — but fragment
  // 0 is the only one that DECLARES the group's global (`var CATALOG=...`
  // etc.); every other fragment just pushes/copies into it. Under real
  // concurrency, a later-index fragment can finish decrypting before
  // fragment 0 does — launching it first would throw (the global doesn't
  // exist yet with anything to push into). groupRow.pendingLaunch queues
  // any such early-finisher until fragment 0 has actually declared the
  // global, then flushes them all at once, in the order they finished
  // (order among 1..N-1 doesn't matter — report.html's own array-push
  // order is what matters for identity, not launch order, and each push
  // is independent of the others).
  function launchFragmentWhenReady(groupRow,f){
    if(f.index===0){
      runScriptOnly(f.html);
      groupRow.declared=true;
      groupRow.pendingLaunch.forEach(function(pf){runScriptOnly(pf.html);});
      groupRow.pendingLaunch=[];
      notifyDataUpdated();
    }else if(groupRow.declared){
      runScriptOnly(f.html);
      notifyDataUpdated();
    }else{
      groupRow.pendingLaunch.push(f);
      updateMiniPanelProgress();
    }
  }
  function downloadFragment(groupRow,f){
    f.loaded=0;
    f.state='downloading';
    return downloadWithRetry(f.file,f.size,function(loaded){
      f.loaded=loaded;
      updateMiniPanelProgress();
    }).then(function(buf){
      return caches.open(MODULES_CACHE_NAME).then(function(c){return c.put(f.file,new Response(buf));}).then(function(){
        f.loaded=f.size;
        return buf;
      });
    });
  }
  // Never rejects — matches runPool()'s "worker() must never reject"
  // contract, so one fragment's failure can't abort the others still in
  // flight. A cache-read/download failure marks just that one fragment as
  // errored (retryable via retryAllFailed() below); a decrypt failure is
  // treated the same way now (see attemptDataRow's own comment for why
  // that's a deliberate change from the old checklist's per-fragment
  // hard-fail).
  function resolveFragment(groupRow,f){
    return cacheHas(f.file).then(function(has){
      var bufPromise=has
        ? caches.open(MODULES_CACHE_NAME).then(function(c){return c.match(f.file);}).then(function(r){return r.arrayBuffer();})
        : downloadFragment(groupRow,f);
      return bufPromise.then(function(buf){
        return decModuleWithRetry(buf,window.__spriteKey).then(function(html){
          f.html=html;
          f.state=has?'unchanged':'done';
          launchFragmentWhenReady(groupRow,f);
        }).catch(function(err){
          f.state='error';
          updateMiniPanelProgress();
          console.log('fragment failed to decrypt (non-fatal):',f.file,err);
        });
      },function(err){
        f.state='error';
        updateMiniPanelProgress();
        console.log('fragment failed to download (non-fatal, retryable):',f.file,err);
      });
    });
  }
  // Two phases so cachedCount/staleCount are a stable snapshot (set once)
  // rather than incrementally revealed as concurrency-limited checks
  // trickle in — mirrors the old attemptCriticalGroup's own reasoning,
  // even though nothing reads cachedCount/staleCount directly anymore
  // (kept for the mini panel's aggregate math and for parity/debugging).
  function attemptFragmentedGroup(row){
    return Promise.all(row.fragments.map(function(f){
      return cacheHas(f.file).then(function(has){f.cached=has;if(has)f.loaded=f.size;});
    })).then(function(){
      row.cachedCount=row.fragments.filter(function(f){return f.cached;}).length;
      row.staleCount=row.fragments.length-row.cachedCount;
      updateMiniPanelProgress();
      return runPool(row.fragments,DOWNLOAD_CONCURRENCY,function(f){return resolveFragment(row,f);});
    });
  }

  function attemptSprite(row){
    return resolveRow(row,false).then(function(){
      updateMiniPanelProgress();
    }).catch(function(err){
      row.state='error';
      updateMiniPanelProgress();
      console.log('sprite sheet failed to load (non-fatal — thumbnails fall back to a live hotlink once every sheet has settled):',row.file,err);
    });
  }

  // ── Minimized progress panel ─────────────────────────────────────────
  // Created via document.createElement, appended to document.body/<head>
  // AFTER shell's launch() has already wiped the lock screen — there is no
  // surviving DOM from before that to reuse (same technique already used
  // by showUpdateBanner() below). Hardcoded literal colors, not the
  // shell's --bg/--i/--go CSS vars — launch() removes #_shellStyle before
  // the real app renders (see launch()'s own comment above), so those
  // vars won't exist by the time this shows.
  var MINI_PANEL=null,ALL_BG_ROWS=[];
  function initMiniPanel(){
    var style=document.createElement('style');
    style.textContent='#_prog{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;'
      +'background:#1a1008;color:#f0e8d8;font-family:Georgia,"Times New Roman",serif;font-size:.8rem;'
      +'padding:8px 14px;border-radius:20px;display:flex;align-items:center;gap:8px;'
      +'box-shadow:0 4px 18px rgba(0,0,0,.35);transition:opacity .6s ease,transform .6s ease;cursor:default;}'
      +'#_prog.done{background:#2f6b2f;}#_prog.err{background:#7a1f1f;cursor:pointer;}'
      +'#_prog.fade{opacity:0;transform:translateX(-50%) translateY(8px);}'
      +'#_progbar{width:60px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden;flex-shrink:0;}'
      +'#_progbarfill{display:block;height:100%;width:0%;background:#f0e8d8;transition:width .2s ease;}'
      +'#_progicon{width:16px;height:16px;flex-shrink:0;}#_progicon svg{width:100%;height:100%;display:block;fill:currentColor;}';
    document.head.appendChild(style);
    var panel=document.createElement('div');panel.id='_prog';
    panel.innerHTML='<span id="_progicon">'+ICONS.downloading+'</span>'
      +'<span id="_progtext">Loading catalog…</span>'
      +'<span id="_progbar"><span id="_progbarfill"></span></span>';
    document.body.appendChild(panel);
    MINI_PANEL={el:panel,textEl:panel.querySelector('#_progtext'),barFillEl:panel.querySelector('#_progbarfill'),iconEl:panel.querySelector('#_progicon')};
    panel.addEventListener('click',function(){if(panel.className.indexOf('err')!==-1)retryAllFailed();});
    updateMiniPanelProgress();
  }
  function updateMiniPanelProgress(){
    if(!MINI_PANEL)return;
    var loaded=0,total=0,done=0,count=0;
    ALL_BG_ROWS.forEach(function(row){
      var items=row.type==='group'?row.fragments:[row];
      items.forEach(function(it){
        count++;
        if(it.state==='error')return;
        total+=it.size;loaded+=(it.loaded||0);
        if(it.state==='done'||it.state==='unchanged')done++;
      });
    });
    MINI_PANEL.barFillEl.style.width=(total>0?Math.min(100,Math.round(loaded/total*100)):100)+'%';
    MINI_PANEL.textEl.textContent='Loading catalog… '+done+'/'+count;
  }
  // Always shrinks to a checkmark and fades, whether or not anything
  // failed (per the owner's explicit ask) — a failure gets a distinct
  // red-tinted variant, a longer dwell, and a tap-to-retry affordance
  // instead of the old per-tile detail-dialog retry UI, which has no
  // natural home once the full-screen tile grid is gone.
  function finishMiniPanel(hadFailures){
    if(!MINI_PANEL)return;
    MINI_PANEL.el.className=hadFailures?'err':'done';
    MINI_PANEL.textEl.textContent=hadFailures?'Done (tap to retry)':'Ready';
    MINI_PANEL.iconEl.innerHTML=hadFailures?ICONS.error:ICONS.check_circle;
    MINI_PANEL.barFillEl.parentNode.style.display='none';
    var panel=MINI_PANEL.el;
    setTimeout(function(){
      panel.className+=' fade';
      setTimeout(function(){
        if(panel.parentNode)panel.parentNode.removeChild(panel);
        if(MINI_PANEL&&MINI_PANEL.el===panel)MINI_PANEL=null;
      },700);
    },hadFailures?3000:1500);
  }
  function retryAllFailed(){
    MINI_PANEL.el.className='';MINI_PANEL.barFillEl.parentNode.style.display='';
    var groupRetries=ALL_BG_ROWS.filter(function(r){return r.type==='group'&&r.fragments.some(function(f){return f.state==='error';});})
      .map(function(r){return runPool(r.fragments.filter(function(f){return f.state==='error';}),DOWNLOAD_CONCURRENCY,function(f){f.state='pending';return resolveFragment(r,f);});});
    var rowRetries=ALL_BG_ROWS.filter(function(r){return r.type!=='group'&&r.state==='error'&&r.key&&r.key.indexOf('sprite')!==0;}).map(attemptDataRow);
    var spriteRetries=ALL_BG_ROWS.filter(function(r){return r.key&&r.key.indexOf('sprite')===0&&r.state==='error';}).map(attemptSprite);
    Promise.all([].concat(groupRetries,rowRetries,spriteRetries)).then(function(){
      var stillFailing=ALL_BG_ROWS.some(function(r){return r.type==='group'?r.fragments.some(function(f){return f.state==='error';}):r.state==='error';});
      finishMiniPanel(stillFailing);
      if(!stillFailing&&window.__catalogDataUpdated)window.__catalogDataUpdated({final:true});
    });
  }

  function beginBackgroundLoad(manifest){
    var dataRows=buildDataRows(manifest);
    var spriteRows=buildSpriteRows(manifest);
    ALL_BG_ROWS=dataRows.concat(spriteRows);
    initMiniPanel();
    var dataSettled=Promise.all(dataRows.map(function(row){
      return row.type==='group'?attemptFragmentedGroup(row):attemptDataRow(row);
    }));
    var spritesSettled=runPool(spriteRows,DOWNLOAD_CONCURRENCY,attemptSprite);
    Promise.all([dataSettled,spritesSettled]).then(function(){
      spritesSettledResolve();
      if(window.__catalogDataUpdated)window.__catalogDataUpdated({final:true});
      var hadFailures=ALL_BG_ROWS.some(function(r){
        return r.type==='group'?r.fragments.some(function(f){return f.state==='error';}):r.state==='error';
      });
      finishMiniPanel(hadFailures);
    });
  }

  function startBackgroundLoad(p){
    return dk(p,b2b(SALT_B64)).then(function(k){
      window.__spriteKey=k;
      return fetch('build-manifest.json',{cache:'no-store'}).then(function(r){
        if(!r.ok)throw new Error('manifest http '+r.status);
        return r.json();
      });
    }).then(function(manifest){
      return resolveRow(buildShellRow(manifest),true).then(function(buf){
        return decModuleWithRetry(buf,window.__spriteKey);
      }).then(function(shellHtml){
        localStorage.setItem(SK,p);
        ensureDataStubs();
        launch(shellHtml); // app visible NOW, empty catalog
        beginBackgroundLoad(manifest); // fire-and-forget from here
      },hardFailWrongPassphrase); // the ONE real wrong-passphrase gate
    });
  }

  // Sprites are primed the same way after a FAST-path launch too (see
  // fastPathLaunch below) — without this, window.__spritesSettled would
  // never resolve for a fast-path session, and report.html's
  // wireThumbFallback() would wait on it forever for any genuinely-missing
  // thumbnail.
  function beginSpritePriming(manifest){
    var spriteRows=buildSpriteRows(manifest);
    runPool(spriteRows,DOWNLOAD_CONCURRENCY,attemptSprite).then(function(){
      spritesSettledResolve();
    });
  }

  // ── Fast-path launch ──────────────────────────────────────────────────
  // Skips the background loader entirely when everything critical is
  // ALREADY fully cached from a previous visit, so entry never blocks on a
  // network round-trip or a download that could fail — the owner's actual
  // complaint was getting stuck on the loading screen for minutes (or
  // stuck outright on a failed download) just to re-enter an app they'd
  // already fully downloaded before. Falls through to
  // startBackgroundLoad() (above) for any cold/incomplete-cache case —
  // first-ever visit, cleared cache, or an interrupted previous download
  // all still get the full progressive load, just with nothing already
  // cached to skip. Purely additive.

  // No network call — reads whatever build-manifest.json the SW's own
  // network-first fetch handler last successfully cached (see sw.js's
  // fetch handler: every successful manifest fetch gets cache.put into
  // its build-ID-scoped CACHE namespace, regardless of what the page does
  // with it afterward).
  function readManifestFromCache(){
    return caches.match('build-manifest.json').then(function(r){
      return r?r.json():null;
    }).catch(function(){return null;});
  }
  // Sprites deliberately excluded — they're non-critical/best-effort in
  // both paths (see attemptSprite/beginSpritePriming).
  function checkAllCriticalCached(manifest){
    var files=[manifest.shell.file,manifest.misc.file,manifest.storeHistory.file]
      .concat(manifest.catalogFragments.map(function(f){return f.file;}))
      .concat(manifest.productsHistoricalFragments.map(function(f){return f.file;}))
      .concat(manifest.boxContentsFragments.map(function(f){return f.file;}));
    return Promise.all(files.map(cacheHas)).then(function(rs){return rs.every(Boolean);});
  }
  // Cache-only twin of resolveRow()'s cache-hit branch — no DOM coupling
  // (row.el/statusEl/barFillEl don't exist for a fast-path/background-check
  // "row", so the existing DOM-writing row functions can't be reused here).
  function readModuleBuffer(file){
    return caches.open(MODULES_CACHE_NAME).then(function(c){return c.match(file);}).then(function(r){
      if(!r)throw new Error('cache entry missing: '+file);
      return r.arrayBuffer();
    });
  }
  // Rejects with a tagged {code} error: 'no-fast-path' (nothing cached, or
  // not everything critical present — no side effects, safe to fall
  // through) / 'cache-read-error' (a cache entry vanished/corrupted after
  // checkAllCriticalCached said it was there — safe to fall through, the
  // slow path will re-download and self-heal) / 'wrong-passphrase' (every
  // buffer read fine, but decryption failed — AES-GCM auth-tag failure is
  // inherently indistinguishable from "wrong key" at the decrypt call
  // itself, same as how shell's own decrypt failure is treated — see
  // hardFailWrongPassphrase's own comment).
  //
  // Reads everything, THEN decrypts everything, THEN launches everything —
  // deliberately never launches partway through, so a mid-flight failure
  // never leaves a half-replaced page with no working fallback. Named
  // groups (not positional slicing) now that there are 3 fragmented
  // datasets instead of 1 — positional slicing got easy to misindex.
  function fastPathLaunch(p){
    var manifest;
    function readGroup(fragmentsManifest){
      return Promise.all(fragmentsManifest.map(function(f){
        return readModuleBuffer(f.file).catch(function(){throw {code:'cache-read-error'};});
      }));
    }
    function decOne(buf){
      return decModuleWithRetry(buf,window.__spriteKey).catch(function(){throw {code:'wrong-passphrase'};});
    }
    function decGroup(bufs){
      return Promise.all(bufs.map(decOne));
    }
    return readManifestFromCache().then(function(m){
      manifest=m;
      if(!manifest)throw {code:'no-fast-path'};
      return checkAllCriticalCached(manifest);
    }).then(function(allCached){
      if(!allCached)throw {code:'no-fast-path'};
      return dk(p,b2b(SALT_B64));
    }).then(function(k){
      window.__spriteKey=k;
      return Promise.all([
        readModuleBuffer(manifest.shell.file).catch(function(){throw {code:'cache-read-error'};}),
        readModuleBuffer(manifest.misc.file).catch(function(){throw {code:'cache-read-error'};}),
        readModuleBuffer(manifest.storeHistory.file).catch(function(){throw {code:'cache-read-error'};}),
        readGroup(manifest.catalogFragments),
        readGroup(manifest.productsHistoricalFragments),
        readGroup(manifest.boxContentsFragments),
      ]);
    }).then(function(bufs){
      return Promise.all([
        decOne(bufs[0]),decOne(bufs[1]),decOne(bufs[2]),
        decGroup(bufs[3]),decGroup(bufs[4]),decGroup(bufs[5]),
      ]);
    }).then(function(htmls){
      // Every buffer decrypted successfully with this passphrase — same
      // "now known-good, persist it" point startBackgroundLoad() reaches
      // after shell's own decrypt succeeds. Missing this (caught in
      // testing: a manual submit that went through the fast path launched
      // fine but silently forgot the passphrase for next visit) would make
      // fast-path-only sessions never auto-resume again.
      localStorage.setItem(SK,p);
      // Order among misc/storeHistory/the 3 fragmented datasets doesn't
      // matter (report.html never references any of these globals until
      // after every data <script> tag has run) — only "shell last" does,
      // same fixed order the progressive path's own launch calls use.
      launch(htmls[1]);
      launch(htmls[2]);
      launch(htmls[3].join('\n'));
      launch(htmls[4].join('\n'));
      launch(htmls[5].join('\n'));
      launch(htmls[0]);
      return manifest;
    });
  }

  // ── Silent background update check ──────────────────────────────────
  // Called once, only right after a successful fastPathLaunch — the
  // progressive path already fetches the latest manifest and downloads
  // everything fresh by construction, so it never needs this follow-up.
  function diffManifestFiles(oldManifest,newManifest){
    var changed=[];
    if(oldManifest.shell.file!==newManifest.shell.file)changed.push(newManifest.shell);
    if(oldManifest.misc.file!==newManifest.misc.file)changed.push(newManifest.misc);
    if(oldManifest.storeHistory.file!==newManifest.storeHistory.file)changed.push(newManifest.storeHistory);
    newManifest.catalogFragments.forEach(function(f,i){
      var old=oldManifest.catalogFragments[i];
      if(!old||old.file!==f.file)changed.push(f);
    });
    newManifest.productsHistoricalFragments.forEach(function(f,i){
      var old=oldManifest.productsHistoricalFragments[i];
      if(!old||old.file!==f.file)changed.push(f);
    });
    newManifest.boxContentsFragments.forEach(function(f,i){
      var old=oldManifest.boxContentsFragments[i];
      if(!old||old.file!==f.file)changed.push(f);
    });
    newManifest.sprites.forEach(function(s,i){
      var old=oldManifest.sprites[i];
      if(!old||old.file!==s.file)changed.push(s);
    });
    return changed;
  }
  // Downloads+decrypts (integrity check only, never launch()s) just the
  // changed files. Shows the update banner only if EVERY changed file
  // succeeds; any failure anywhere is silently swallowed — the user is
  // already inside the app via the fast path, nothing to interrupt. No
  // retry loop, no periodic polling — one best-effort pass per fast-path
  // launch; a failed check just means the next visit tries again fresh
  // (see this feature's plan doc for the one accepted edge case: a
  // manifest fetch that succeeds followed by a download that doesn't
  // leaves the NEXT visit's fast path correctly falling through to one
  // slow-path checklist rather than retrying silently again).
  function backgroundCheckForUpdate(oldManifest){
    fetch('build-manifest.json',{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('manifest http '+r.status);
      return r.json();
    }).then(function(newManifest){
      if(newManifest.buildId===oldManifest.buildId)return;
      var changed=diffManifestFiles(oldManifest,newManifest);
      if(!changed.length)return;
      return Promise.all(changed.map(function(f){
        return cacheHas(f.file).then(function(has){
          var bufPromise=has?readModuleBuffer(f.file):downloadWithRetry(f.file,f.size,function(){}).then(function(buf){
            return caches.open(MODULES_CACHE_NAME).then(function(c){return c.put(f.file,new Response(buf));}).then(function(){return buf;});
          });
          return bufPromise.then(function(buf){return decModuleWithRetry(buf,window.__spriteKey);});
        });
      })).then(function(){
        showUpdateBanner();
      });
    }).catch(function(err){
      console.log('background update check failed (ignored, app keeps working on the current build):',err);
    });
  }
  // Appended to the POST-launch body (the real app's DOM), never the lock
  // screen — every launch() call wipes document.body.innerHTML, so this
  // only makes sense called after fastPathLaunch's four launch() calls
  // have already run. Hardcoded literal colors, not the shell's --bg/--i/
  // --go CSS vars — launch() removes #_shellStyle before the real app
  // renders (see launch()'s own comment above), so those vars won't exist
  // by the time this shows.
  function showUpdateBanner(){
    if(document.getElementById('_updbanner'))return;
    var style=document.createElement('style');
    style.textContent='#_updbanner{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);'
      +'z-index:99999;background:#1a1008;color:#f0e8d8;font-family:Georgia,"Times New Roman",serif;'
      +'font-size:.86rem;padding:10px 10px 10px 16px;border-radius:8px;'
      +'box-shadow:0 4px 18px rgba(0,0,0,.35);display:flex;align-items:center;gap:12px;}'
      +'#_updbanner button{background:#8a6520;color:#f0e8d8;border:none;border-radius:5px;'
      +'padding:8px 14px;font-family:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap;}'
      +'#_updbanner button:active{opacity:.8;}';
    document.head.appendChild(style);
    var bar=document.createElement('div');bar.id='_updbanner';
    var msg=document.createElement('span');msg.textContent='Update ready';
    var btn=document.createElement('button');btn.type='button';btn.textContent='Reload';
    btn.addEventListener('click',function(){location.reload();});
    bar.appendChild(msg);bar.appendChild(btn);
    document.body.appendChild(bar);
  }

  // Decrypt failure after a successful download/cache-read is almost
  // certainly a wrong passphrase (the bytes fetched fine) — the bytes stay
  // validly cached for a future correct attempt (only decryption is
  // passphrase-sensitive, caching isn't), but this attempt is done: revert
  // to the passphrase form. This is now the ONLY real wrong-passphrase
  // gate in the whole flow (shell's own decrypt call, in both
  // startBackgroundLoad and fastPathLaunch) — every other module/fragment/
  // sprite shares the same derived key, so once shell itself decrypts
  // successfully the passphrase is proven correct; anything else failing
  // to decrypt afterward can only mean data corruption, not a bad
  // passphrase (see attemptDataRow's own comment).
  function hardFailWrongPassphrase(){
    UNLOCK_IN_FLIGHT=false;
    document.getElementById('_gf').style.display='';
    localStorage.removeItem(SK);
    gm.textContent='Wrong passphrase — try again.';gm.className='e';
  }

  // Single choke point for every way an unlock attempt can begin (auto-
  // resume, manual passphrase submit) — was previously two unguarded,
  // independent call sites (confirmed no in-flight guard existed anywhere
  // in this file): a manual resubmit during an in-flight auto-resume used
  // to race it, since the passphrase form stayed visible/interactive until
  // beginChecklist()'s later showChecklistUI() call. Now the form is
  // hidden the INSTANT any attempt begins, and a second concurrent
  // attemptUnlock() call is simply a no-op.
  function beginUnlockAttempt(msg){
    if(UNLOCK_IN_FLIGHT)return false;
    UNLOCK_IN_FLIGHT=true;
    document.getElementById('_gf').style.display='none';
    gm.textContent=msg;gm.className='w';
    return true;
  }
  function endUnlockAttempt(showForm){
    UNLOCK_IN_FLIGHT=false;
    if(showForm)document.getElementById('_gf').style.display='';
  }
  function attemptUnlock(p,isAutoResume){
    if(!beginUnlockAttempt(isAutoResume?'Unlocking…':'Unlocking… (first time takes a moment)'))return;
    fastPathLaunch(p).then(function(manifest){
      // Success — #_gf is gone along with the rest of the lock-screen DOM
      // (launch() replaced document.body.innerHTML), so UNLOCK_IN_FLIGHT
      // is moot from here; no need to reset it. Sprites are outside the
      // fast path's "everything critical" set, so they still need their
      // own priming pass here (see beginSpritePriming's own comment).
      backgroundCheckForUpdate(manifest);
      beginSpritePriming(manifest);
    }).catch(function(err){
      if(err&&err.code==='wrong-passphrase'){hardFailWrongPassphrase();return;}
      // no-fast-path or cache-read-error (or fastPathLaunch's own promise
      // chain throwing something unexpected) — fall through to the
      // progressive background loader, which handles a cold/incomplete
      // cache safely and transparently on its own.
      startBackgroundLoad(p).catch(function(){
        // Failure here is a manifest/network problem, not a wrong
        // passphrase (that only surfaces later, at decrypt time, inside
        // attemptCritical) — leave the stored passphrase alone since it's
        // likely still correct, and just fall back to the passphrase form
        // so the user can retry manually.
        endUnlockAttempt(true);
        gm.textContent=isAutoResume?'':'Couldn\'t reach the server — check your connection and try again.';
        gm.className=isAutoResume?'':'e';
      });
    });
  }

  var sv=localStorage.getItem(SK);
  if(sv){
    attemptUnlock(sv,true);
  }

  document.getElementById('_gf').addEventListener('submit',function(e){
    e.preventDefault();
    var p=document.getElementById('_pw').value;
    if(!p)return;
    attemptUnlock(p,false);
  });
}());
</script>
<script>
(function(){
  var ref=document.getElementById('_ref');
  ref.addEventListener('click',function(){
    var btn=this;btn.textContent='Clearing…';btn.disabled=true;
    Promise.all([
      navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}):Promise.resolve(),
      window.caches?caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}):Promise.resolve()
    ]).then(function(){location.reload(true);});
  });
}());
</script>
</body>
